name: PR Title Lint

# Managed by stein-infra (tofu/pr-title-lint.tf). Do NOT edit here — this file is
# overwritten on the next apply. Change the template in stein-infra instead.

# pull_request_target, not pull_request: a pull_request run loads this file from
# the PR's merge commit, and release-please's PRs self-merge within ~5s, before
# that commit exists, so every run died as a zero-job "workflow file issue"
# failure. pull_request_target loads it from the base branch instead. Safe here
# because nothing checks out or executes PR code; only the title is read.
on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]

# Explicit block elevates over a repo's read-only default token — enough to post
# the sticky comment. Posting a PR comment is not "approving a PR", so no elevated
# repo default and no can_approve are needed (contrast release-please).
permissions:
  pull-requests: write

# No concurrency group: a push followed by a PR edit fires two runs a second apart, and
# cancel-in-progress left the cancelled one attached to the head sha as a failing check, which
# merge gates and the hpipe pipeline read as red CI. The lint is idempotent; overlapping runs only
# race on the sticky comment.

jobs:
  lint-title:
    # Release PR titles are machine-generated and conventional by construction.
    if: ${{ !startsWith(github.head_ref, 'release-please--') }}
    runs-on: ubuntu-latest
    steps:
      # The v5 tag is v5.5.2 plus one release-metadata commit; dist/ is identical.
      - uses: amannn/action-semantic-pull-request@e32d7e603df1aa1ba07e981f2a23455dee596825 # v5.5.2
        id: lint
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            chore
            docs
            ci
            refactor
            perf
            test
            build
            style
            revert
          requireScope: false

      # Loud: post/refresh an explanatory comment while the title is invalid.
      - uses: marocchino/sticky-pull-request-comment@773744901bac0e8cbb5a0dc842800d45e9b2b405 # v2.9.4
        if: always() && steps.lint.outputs.error_message != null
        with:
          header: pr-title-lint
          message: |
            **This PR's title isn't a valid Conventional Commit.**

            We squash-merge, so the **PR title becomes the commit message**
            release-please parses. A non-conventional title means **no release
            fires** (and version bumps are skipped).

            Use `<type>(<optional-scope>): <subject>`, where type is one of:
            `feat` `fix` `chore` `docs` `ci` `refactor` `perf` `test` `build` `style` `revert`.

            Examples: `feat(auth): add token refresh` · `fix: handle empty cursor`

            _This check is advisory — it can't block the merge on a free-plan
            private repo — but merging as-is will likely skip the release._

            Details: ${{ steps.lint.outputs.error_message }}

      # Self-clean once the title is fixed.
      - uses: marocchino/sticky-pull-request-comment@773744901bac0e8cbb5a0dc842800d45e9b2b405 # v2.9.4
        if: steps.lint.outputs.error_message == null
        with:
          header: pr-title-lint
          delete: true
